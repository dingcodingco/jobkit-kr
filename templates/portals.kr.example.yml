# jobkit-kr — 한국 구직자용 portals.yml 예시
#
#   cp templates/portals.kr.example.yml portals.yml
#
# 원본(career-ops)의 templates/portals.example.yml은 미국·유럽 시장을 기준으로
# 2,700줄이 넘는다. 이 파일은 그 자리를 한국 시장 하나로 좁힌 것이다. 필요하면
# 원본 예시에서 Greenhouse·Lever·Ashby 항목을 그대로 가져와 붙여도 된다.
# 한국 회사 중에도 자체 채용 페이지를 Greenhouse나 Lever로 돌리는 곳이 있다.
#
# 아래 필터는 그대로 쓰라고 둔 게 아니라 자기 기준으로 고치라고 둔 것이다.
# 특히 title_filter는 본인이 지원할 직무명으로 바꿔야 의미가 있다.

# ── 직무명 필터 ────────────────────────────────────────────────────
# 공고 제목에만 걸린다. 한국 공고는 제목에 경력 연차와 고용 형태를 함께 적는
# 관행이 있어서(예: "백엔드 개발자 (3년 이상)", "마케터 채용_계약직"),
# negative 쪽에 형태 키워드를 넣어두면 걸러지는 양이 꽤 된다.
title_filter:
  positive:
    - "AI"
    - "인공지능"
    - "자동화"
    - "데이터"
    - "프로덕트"
    - "PM"
    - "기획"
    - "콘텐츠"
    - "그로스"
    - "마케팅"
  negative:
    - "인턴"
    - "체험형"
    - "계약직"
    - "파견"
    - "아르바이트"
    - "영업직"
    # 신입 공고를 아예 빼고 싶으면 아래 주석을 푼다. 경력직만 보는 게
    # 아니라면 켜지 않는 편이 낫다. 한국 공고는 "신입/경력"을 한 제목에
    # 같이 적는 경우가 많아서 경력 공고까지 같이 날아간다.
    # - "신입"

# ── 근무지 필터 ────────────────────────────────────────────────────
# 원티드는 "서울 강남구", 점핏은 "경기 성남시 분당구" 형태로 내려준다.
# 시 단위만 적어두면 구 단위 값도 함께 걸린다.
location_filter:
  always_allow:
    - "재택"
    - "원격"
    - "Remote"
  allow:
    - "서울"
    - "경기"
    - "성남"
    - "판교"
    - "인천"
    - "재택"
    - "원격"
    - "Remote"
  block:
    - "미국"
    - "일본"
    - "베트남"
    - "싱가포르"

trust_filter:
  enabled: true

# ── 관심 회사 ──────────────────────────────────────────────────────
# 한국 회사 중 채용 페이지를 Greenhouse·Lever·Ashby로 돌리는 곳은 원본의
# 해당 프로바이더가 그대로 붙는다. 그리팅(greetinghr.com)을 쓰는 회사는
# 아직 전용 프로바이더가 없어서, 지금은 공고 URL을 직접 넣어 쓰는 쪽이 맞다.
tracked_companies: []

# ── 채용 보드 ──────────────────────────────────────────────────────
job_boards:

  # ── 원티드 ────────────────────────────────────────────────────────
  # 공개 JSON API, 인증·쿠키·Referer 전부 불필요.
  # 필터 없는 전체 공고를 최신순으로 순회한다. 특정 직군만 보고 싶으면
  # job_group_id를 넣는다(예: 518 = 개발, 523 = 마케팅·광고).
  # 2026-09-14 실측: 100건/페이지, links.next가 끊길 때까지 순회.
  - name: 원티드
    provider: wanted
    careers_url: https://www.wanted.co.kr/jobsfeed
    enabled: true
    # page_size: 100        # 기본 100, 상한 100
    # max_pages: 200        # 안전 상한. 실제 종료는 links.next가 결정한다
    # job_group_id: 518     # 한 직군만 볼 때
    notes: "국내 최대 테크·스타트업 보드. 회사명·근무지·고용형태가 목록 응답에 함께 온다."

  # ── 점핏 ──────────────────────────────────────────────────────────
  # 사람인이 운영하는 개발자 전용 보드. 공개 JSON API.
  # 목록 응답에 기술 스택이 함께 와서, 그 값이 description으로 들어간다.
  # content_filter를 쓰면 "Kotlin 쓰는 곳만" 같은 조건이 바로 걸린다.
  # 2026-09-14 실측: 16건/페이지, 전체 702건(44페이지).
  - name: 점핏
    provider: jumpit
    careers_url: https://jumpit.saramin.co.kr/positions
    enabled: true
    # max_pages: 200        # 안전 상한. 실제 종료는 빈 페이지가 결정한다
    notes: "개발 직군 전용. 비개발 직무를 찾는다면 enabled: false로 두는 게 낫다."


  # ── 사람인 (오픈API) ──────────────────────────────────────────────
  # 국내 최대 채용 보드다. 공식 오픈API가 있고 **인증키가 필요하다.**
  # 이 파일의 다른 보드는 키 없이 열리는 것들이라 이것만 기본이 꺼져 있다.
  #
  # 키는 여기 적지 말고 환경변수에 둔다. portals.yml은 이슈에 붙여넣거나
  # 실수로 커밋하기 쉬운 파일이다.
  #
  #   https://oapi.saramin.co.kr/guide/1 에서 발급
  #   export SARAMIN_ACCESS_KEY=...
  #
  # 다른 한국 보드가 못 주는 것 세 가지를 준다.
  #   - 검색. 원티드·점핏은 전체를 받아 우리가 거르는데, 여기는 회사명·공고
  #     제목·직무 내용을 서버에서 찾아 준다
  #   - 게시일과 마감일을 둘 다 준다. 원티드·점핏은 둘 다 없다
  #   - 헤드헌팅·파견업체 공고를 아예 빼고 받을 수 있다(sr=directhire).
  #     국내 키워드 검색에서 이게 꽤 큰 몫을 차지하고 계속 재등록된다
  #
  # job_type·loc_cd 같은 숫자 코드는 사람인 코드표를 보고 넣는다.
  #   https://oapi.saramin.co.kr/guide/code-table1
  - name: 사람인
    provider: saramin
    enabled: false          # SARAMIN_ACCESS_KEY를 넣고 true로 바꾼다
    saramin_keywords: "CRM 마케터"
    saramin_exclude_directhire: true   # 헤드헌팅·파견업체 제외
    # saramin_loc_mcd: "101,102"       # 지역 코드(콤마 구분)
    # saramin_job_type: "1"            # 고용형태 코드
    # saramin_sort: pd                 # 게시일 역순(기본값)
    # saramin_count: 110               # 한 번에 받을 건수. 상한 110
    # max_pages: 20                    # 안전 상한. 실제 종료는 짧은 페이지가 결정한다
    notes: "키가 있어야 돈다. 없으면 켜도 오류만 난다."

  # ── 그리팅 (회사 채용 페이지) ──────────────────────────────────────
  # **가고 싶은 회사를 콕 집어 볼 때만 쓴다. 검색 기능이 없다.**
  #
  # 국내에서 가장 널리 쓰이는 채용 관리 시스템인데, 전체를 훑는 길이 없다.
  # 회사마다 주소가 {회사}.career.greetinghr.com로 따로 있어서 회사 이름을
  # 하나씩 적어 줘야 한다. 그래서 기본이 꺼져 있다 — 켜 두면 남이 고른
  # 회사 공고만 나온다.
  #
  # 그래도 남겨 둔 이유는 사람인에 안 올리고 자사 채용 페이지만 쓰는 회사가
  # 있기 때문이다. 그런 회사를 노린다면 여기에 적는다.
  #
  # 회사 이름은 그 회사 채용 페이지 주소에서 가져온다. 예를 들어
  # https://musinsa.career.greetinghr.com 이면 musinsa다. 자체 도메인으로
  # 옮긴 회사는 그 주소를 그대로 적는다(무신사 → www.musinsacareers.com).
  - name: 그리팅
    provider: greeting
    enabled: false          # 가고 싶은 회사를 적고 true로 바꾼다
    greeting_companies: []
    # greeting_companies:
    #   - finda
    #   - www.musinsacareers.com
    # greeting_employment:   # 고용형태로 거르고 싶을 때. 제목이 아니라 실제 값을 본다
    #   - FULL_TIME_WORKER   # 정규직
    # max_pages: 60          # 한 번에 훑을 회사 수 상한(회사당 요청 1건)
    notes: "검색이 없다. 회사를 직접 적는 용도다."

# ── 검색 쿼리 ──────────────────────────────────────────────────────
# WebSearch로 도는 경로다. 사람인·잡코리아는 공개 JSON API가 없어서
# 프로바이더로 붙이지 못하고, 이 자리에서 site: 검색으로 훑는다.
# 검색 결과는 캐시된 과거 공고를 물고 오는 일이 잦다. 원문 URL을 반드시
# 다시 열어보고, 404거나 마감됐으면 후보에서 뺀다.
search_queries:
  - name: 사람인 — AI·자동화
    query: 'site:saramin.co.kr ("AI" OR "인공지능" OR "자동화") (기획 OR PM OR 데이터)'
    enabled: false

  - name: 잡코리아 — AI·자동화
    query: 'site:jobkorea.co.kr ("AI" OR "인공지능") (기획 OR 마케팅 OR 데이터)'
    enabled: false
